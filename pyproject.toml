[project]
name = "carbon-txt"
version = "0.0.28"
description = "A command line tool containing a validator for carbon.txt files, by the Green Web Foundation"
authors = [
    { name = "Chris Adams" },
    { name = "Hannah Smith" },
    { name = "Fershad Irani" },
    { name = "Tim Cowlishaw" },
]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.11"
classifiers = ["License :: OSI Approved :: Apache Software License"]
dependencies = [
    "dnspython>=2.8.0",
    "httpx>=0.28.1",
    "pluggy>=1.6.0",
    "pydantic-extra-types>=2.11.1",
    "rich>=15.0.0",
    "structlog>=26.1.0",
    "tldextract>=5.3.2",
    "tomlkit>=0.15.1",
    "typer>=0.27.1",
]

[project.optional-dependencies]
csrd = [
    "arelle-release>=2.44.2",
]
web = [
    "django~=5.2.16",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-ninja>=1.6.2",
    "django-structlog>=10.1.0",
    "granian>=2.8.1",
    "sentry-sdk[django]>=2.67.1",
]

ai_model_cards = [
    "python-frontmatter>=1.3.0",
    "mistletoe>=1.6.0",
]


all = ["carbon-txt[csrd,web,ai_model_cards]"]

[project.scripts]
carbon-txt = "carbon_txt.cli:app"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "carbon-txt[all]",
    "ipdb>=0.13.13",
    "mypy>=2.3.0",
    "pytest-django>=4.14.0",
    "pytest-watch>=4.2.0",
    "pytest>=9.1.1",
    "sphinx>=8.1.3",
    "myst-parser>=5.1.0",
    "furo>=2025.12.19",
    "sphinx-autobuild>=2025.8.25",
    "twine>=7.0.0",
    "pytest-coverage>=0.0",
    "marimo>=0.23.16",
    "pytest-httpx>=0.36.2",
    "pytest-mock>=3.15.1",
    "ansible>=11.13.0",
    "django-stubs[compatible-mypy]>=6.1.0",
]
